{% extends "tienda/base.html" %}
{% block contenido %}
<div style="max-width:420px; margin:60px auto; background:white; padding:32px; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,0.07); text-align:center;">
    <div style="font-size:56px;">✅</div>
    <h2 style="color:#2c3e50; margin:12px 0;">¡Contraseña restablecida!</h2>
    <p style="color:#7f8c8d; font-size:14px;">Ya puedes iniciar sesión con tu nueva contraseña.</p>
    <a href="{% url 'login' %}"
       style="display:inline-block; margin-top:20px; padding:10px 24px; background:linear-gradient(135deg,#144272,#205295); color:white; border-radius:8px; text-decoration:none; font-weight:600; font-size:14px;">
        Ir al login
    </a>
</div>
{% endblock %}
