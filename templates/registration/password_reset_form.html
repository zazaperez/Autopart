{% extends "tienda/base.html" %}
{% block content %}
<div style="max-width:420px; margin:60px auto; background:white; padding:32px; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,0.07);">
    <div style="text-align:center; margin-bottom:24px;">
        <div style="font-size:48px;">🔑</div>
        <h2 style="color:#2c3e50; margin:8px 0;">¿Olvidaste tu contraseña?</h2>
        <p style="color:#7f8c8d; font-size:14px;">Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>
    </div>
    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom:16px;">
            <label style="display:block; font-weight:600; color:#2c3e50; margin-bottom:6px;">Correo electrónico</label>
            <input type="email" name="email" required placeholder="tu@correo.com"
                   style="width:100%; padding:11px 15px; border:2px solid #e0e6ed; border-radius:8px; font-size:14px; box-sizing:border-box;">
        </div>
        <button type="submit"
                style="width:100%; padding:12px; background:linear-gradient(135deg,#144272,#205295); color:white; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;">
            Enviar enlace
        </button>
    </form>
    <div style="text-align:center; margin-top:16px;">
        <a href="{% url 'login' %}" style="color:#7f8c8d; font-size:13px;">← Volver al login</a>
    </div>
</div>
{% endblock %}
